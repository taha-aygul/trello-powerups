<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>İşaret önizleme</title>
    <style>
      body { margin: 0; font: 14px -apple-system, Segoe UI, system-ui, sans-serif; background: #1d2125; color: #b6c2cf; padding: 20px; }
      h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .5; margin: 0 0 10px; }
      .card { width: 262px; border-radius: 8px; padding: 10px 12px; background: #22272b; box-shadow: 0 1px 1px #00000052; margin-bottom: 14px; }
      .title { font-size: 14px; line-height: 20px; margin-bottom: 8px; }
      .badges { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
      .pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; }
      .pill img { width: 13px; height: 13px; display: block; }
      .swatch { width: 18px; height: 12px; border-radius: 3px; display: block; }
      .row { display: flex; gap: 26px; align-items: flex-start; }
      .big { display: flex; flex-wrap: wrap; gap: 14px; max-width: 560px; }
      .big figure { margin: 0; width: 84px; text-align: center; }
      .big .sq { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
      .big img { width: 34px; height: 34px; }
      .big figcaption { font-size: 10px; opacity: .6; }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <h2>Geniş — kart üstünde</h2>
        <div class="card">
          <div class="title">Level 1-5 level complete atlayan sekans sistemi</div>
          <div class="badges" id="wide"></div>
        </div>
        <h2>Dar — sadece renk</h2>
        <div class="card">
          <div class="title">Level 1-5 level complete atlayan sekans sistemi</div>
          <div class="badges" id="narrow"></div>
        </div>
      </div>
      <div>
        <h2>İkonlar büyük</h2>
        <div class="big" id="big"></div>
      </div>
    </div>
    <script>
      const MARKS = [
        { label: 'ACİL', color: 'red', hex: '#C9372C', icon: 'urgent' },
        { label: 'BUG', color: 'pink', hex: '#E774BB', icon: 'bug' },
        { label: 'ÖNEMLİ', color: 'orange', hex: '#FEA362', icon: 'important' },
        { label: 'MECHANIC', color: 'blue', hex: '#579DFF', icon: 'mechanic' },
        { label: 'LEVEL DESIGN', color: 'green', hex: '#4BCE97', icon: 'levelDesign' },
        { label: 'QUALITY OF LIFE', color: 'lime', hex: '#94C748', icon: 'qualityOfLife' },
        { label: 'BACKEND', color: 'sky', hex: '#6CC3E0', icon: 'backend' },
        { label: 'ART', color: 'purple', hex: '#8270DB', icon: 'art' },
        { label: 'PERFORMANCE', color: 'yellow', hex: '#E2B203', icon: 'performance' },
        { label: 'NICE TO HAVE', color: 'light-gray', hex: '#8C9BAB', icon: 'niceToHave' },
      ];
      const wide = document.getElementById('wide');
      const narrow = document.getElementById('narrow');
      const big = document.getElementById('big');
      for (const mark of MARKS) {
        wide.insertAdjacentHTML('beforeend',
          `<span class="pill" style="background:${mark.hex}"><img src="./icons/${mark.icon}.svg"/>${mark.label}</span>`);
        narrow.insertAdjacentHTML('beforeend',
          `<img class="swatch" src="./icons/dot-${mark.color}.svg"/>`);
        big.insertAdjacentHTML('beforeend',
          `<figure><div class="sq" style="background:${mark.hex}"><img src="./icons/${mark.icon}.svg"/></div><figcaption>${mark.label}</figcaption></figure>`);
      }
    </script>
  </body>
</html>
