<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>İkon önizleme</title>
    <style>
      body { margin: 0; font: 14px -apple-system, Segoe UI, system-ui, sans-serif; background: #1d2125; color: #b6c2cf; }
      .wrap { display: flex; gap: 0; }
      .pane { flex: 1; padding: 24px; }
      .dark { background: #1d2125; }
      .light { background: #f1f2f4; color: #172b4d; }
      .card { width: 256px; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
      .dark .card { background: #22272b; box-shadow: 0 1px 1px #00000052; }
      .light .card { background: #ffffff; box-shadow: 0 1px 1px #091e4240; }
      .chip { display: inline-block; height: 16px; border-radius: 4px; padding: 0 8px; font-size: 12px; font-weight: 600; line-height: 16px; margin-bottom: 8px; }
      .title { font-size: 14px; line-height: 20px; margin-bottom: 8px; }
      .badges { display: flex; align-items: center; gap: 10px; opacity: .9; }
      .badges img { width: 16px; height: 16px; display: block; }
      .eye { width: 16px; height: 16px; border: 1.6px solid currentColor; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; opacity: .7; }
      .sizes { display: flex; align-items: flex-end; gap: 18px; margin-top: 26px; }
      .sizes figure { margin: 0; text-align: center; }
      .sizes figcaption { font-size: 11px; opacity: .6; margin-top: 6px; }
      h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin: 0 0 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="pane dark">
        <h2>Koyu tema</h2>
        <div class="card">
          <span class="chip" style="background:#4a4a4a;color:#dcdfe4">nice to have</span>
          <div class="title">Level Complete - Level Fail -Settings ekranlarını GameplayView ile uygun hale getirelim</div>
          <div class="badges">
            <div class="eye"></div>
            <img src="./icons/urgent.svg" alt="acil" />
            <img src="./icons/bug.svg" alt="bug" />
          </div>
        </div>
        <div class="sizes">
          <figure><img src="./icons/urgent.svg" width="16" /><figcaption>16</figcaption></figure>
          <figure><img src="./icons/urgent.svg" width="24" /><figcaption>24</figcaption></figure>
          <figure><img src="./icons/urgent.svg" width="48" /><figcaption>48</figcaption></figure>
          <figure><img src="./icons/bug.svg" width="16" /><figcaption>16</figcaption></figure>
          <figure><img src="./icons/bug.svg" width="24" /><figcaption>24</figcaption></figure>
          <figure><img src="./icons/bug.svg" width="48" /><figcaption>48</figcaption></figure>
          <figure><img src="./icons/button.svg" width="24" /><figcaption>buton 24</figcaption></figure>
        </div>
      </div>
      <div class="pane light">
        <h2>Açık tema</h2>
        <div class="card">
          <span class="chip" style="background:#dcdfe4;color:#172b4d">nice to have</span>
          <div class="title">Level Complete - Level Fail -Settings ekranlarını GameplayView ile uygun hale getirelim</div>
          <div class="badges">
            <div class="eye"></div>
            <img src="./icons/urgent.svg" alt="acil" />
            <img src="./icons/bug.svg" alt="bug" />
          </div>
        </div>
        <div class="sizes">
          <figure><img src="./icons/urgent.svg" width="16" /><figcaption>16</figcaption></figure>
          <figure><img src="./icons/urgent.svg" width="24" /><figcaption>24</figcaption></figure>
          <figure><img src="./icons/urgent.svg" width="48" /><figcaption>48</figcaption></figure>
          <figure><img src="./icons/bug.svg" width="16" /><figcaption>16</figcaption></figure>
          <figure><img src="./icons/bug.svg" width="24" /><figcaption>24</figcaption></figure>
          <figure><img src="./icons/bug.svg" width="48" /><figcaption>48</figcaption></figure>
          <figure><img src="./icons/button.svg" width="24" /><figcaption>buton 24</figcaption></figure>
        </div>
      </div>
    </div>
  </body>
</html>
