<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Rozet önizleme</title>
    <style>
      body { margin: 0; font: 14px -apple-system, Segoe UI, system-ui, sans-serif; background: #1d2125; color: #b6c2cf; padding: 24px; }
      .card { width: 256px; border-radius: 8px; padding: 10px 12px; margin-bottom: 18px; background: #22272b; box-shadow: 0 1px 1px #00000052; }
      .labels { display: flex; gap: 4px; margin-bottom: 8px; }
      .label { height: 16px; border-radius: 4px; padding: 0 8px; font-size: 12px; font-weight: 700; line-height: 16px; }
      .title { font-size: 14px; line-height: 20px; margin-bottom: 8px; color: #b6c2cf; }
      .badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .eye { width: 16px; height: 16px; border: 1.6px solid #9fadbc; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; opacity: .7; }
      .pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 12px; font-weight: 700; color: #fff; }
      .pill img { width: 13px; height: 13px; display: block; }
      .red { background: #C9372C; }
      .purple { background: #6E5DC6; }
      h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin: 24px 0 12px; }
      .row { display: flex; gap: 28px; align-items: flex-start; }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <h2>Şu anki hali — sadece rozet</h2>
        <div class="card">
          <div class="labels"><span class="label" style="background:#4a4a4a;color:#dcdfe4">nice to have</span></div>
          <div class="title">Level 1-5 level complete atlayan sekans sistemi</div>
          <div class="badges">
            <div class="eye"></div>
            <span class="pill red"><img src="./icons/urgent.svg" />ACİL</span>
            <span class="pill purple"><img src="./icons/bug.svg" />BUG</span>
          </div>
        </div>
      </div>
      <div>
        <h2>Label ile birlikte — en görünür</h2>
        <div class="card">
          <div class="labels">
            <span class="label" style="background:#C9372C;color:#fff">ACİL</span>
            <span class="label" style="background:#4a4a4a;color:#dcdfe4">nice to have</span>
          </div>
          <div class="title">Level 1-5 level complete atlayan sekans sistemi</div>
          <div class="badges">
            <div class="eye"></div>
            <span class="pill red"><img src="./icons/urgent.svg" />ACİL</span>
          </div>
        </div>
        <div class="card">
          <div class="labels">
            <span class="label" style="background:#AE4787;color:#fff">BUGFIX</span>
          </div>
          <div class="title">Arabalar çarptıktan sonra kırmızı olacak</div>
          <div class="badges">
            <div class="eye"></div>
            <span class="pill purple"><img src="./icons/bug.svg" />BUG</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
